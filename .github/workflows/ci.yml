name: FastFlowLM Maple-20B CI/CD & Binary Autobuilder

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Verify & Release Binaries (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Maple-FLM Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up System Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            build-essential \
            g++ \
            gcc \
            libboost-all-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libvulkan-dev \
            vulkan-tools \
            pkg-config \
            uuid-dev \
            libdrm-dev \
            libelf-dev \
            libreadline-dev \
            libncurses5-dev \
            libfftw3-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            nlohmann-json3-dev \
            python3 \
            python3-pip

      - name: Initialize FastFlowLM & Sync Maple Sources
        run: |
          bash scripts/setup_fastflowlm.sh

      - name: Configure CMake and Compile Binaries with Ninja
        run: |
          bash scripts/build.sh
          ninja -C FastFlowLM/src/build test_maple_vs_qwen36 test_agentic_benchmark

      - name: Execute Full Maple Verification Test Suite
        run: |
          bash scripts/test_maple.sh

      - name: Package Release Binary Tarball
        id: package
        run: |
          PACKAGE_DIR="flm-maple-linux-x86_64"
          mkdir -p "${PACKAGE_DIR}/bin" "${PACKAGE_DIR}/lib" "${PACKAGE_DIR}/share/flm" "${PACKAGE_DIR}/share/fastflowlm/xclbins"
          
          # 1. Executables
          cp -v FastFlowLM/src/build/flm "${PACKAGE_DIR}/bin/flm.real"
          cp -v FastFlowLM/src/build/test_maple_integration "${PACKAGE_DIR}/bin/"
          cp -v FastFlowLM/src/build/test_maple_high_context "${PACKAGE_DIR}/bin/"
          cp -v FastFlowLM/src/build/test_agentic_benchmark "${PACKAGE_DIR}/bin/"
          cp -v FastFlowLM/src/build/test_maple_vs_qwen36 "${PACKAGE_DIR}/bin/"
          cp -v convert_maple.py "${PACKAGE_DIR}/bin/convert_maple"
          chmod +x "${PACKAGE_DIR}/bin/"*
          
          # 2. flm CLI launcher wrapper
          cat <<'WRAPPER_EOF' > "${PACKAGE_DIR}/bin/flm"
          #!/usr/bin/env bash
          SELF_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${SELF_DIR}:${SELF_DIR}/../lib:${SELF_DIR}/../lib/fastflowlm:${SELF_DIR}/../lib/xrt:${LD_LIBRARY_PATH:-}"

          if [ -z "${FLM_CONFIG_PATH:-}" ]; then
              if [ -f "${SELF_DIR}/model_list.json" ]; then
                  export FLM_CONFIG_PATH="${SELF_DIR}/model_list.json"
              elif [ -f "${SELF_DIR}/../share/flm/model_list.json" ]; then
                  export FLM_CONFIG_PATH="${SELF_DIR}/../share/flm/model_list.json"
              elif [ -f "${SELF_DIR}/../share/fastflowlm/model_list.json" ]; then
                  export FLM_CONFIG_PATH="${SELF_DIR}/../share/fastflowlm/model_list.json"
              fi
          fi

          if [ -z "${FLM_XCLBIN_PATH:-}" ]; then
              if [ -d "${SELF_DIR}/xclbins" ]; then
                  export FLM_XCLBIN_PATH="${SELF_DIR}/xclbins"
              elif [ -d "${SELF_DIR}/../share/fastflowlm/xclbins" ]; then
                  export FLM_XCLBIN_PATH="${SELF_DIR}/../share/fastflowlm/xclbins"
              fi
          fi

          exec "${SELF_DIR}/flm.real" "$@"
          WRAPPER_EOF
          chmod +x "${PACKAGE_DIR}/bin/flm"

          # 3. Dynamic Shared Libraries
          if [ -d "FastFlowLM/src/lib/xrt" ]; then
              cp -vrf FastFlowLM/src/lib/xrt/* "${PACKAGE_DIR}/lib/" 2>/dev/null || true
          fi
          cp -a /usr/lib/x86_64-linux-gnu/libavformat* "${PACKAGE_DIR}/lib/" 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libavcodec* "${PACKAGE_DIR}/lib/" 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libavutil* "${PACKAGE_DIR}/lib/" 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libswscale* "${PACKAGE_DIR}/lib/" 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libswresample* "${PACKAGE_DIR}/lib/" 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libboost_program_options* "${PACKAGE_DIR}/lib/" 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libboost_container* "${PACKAGE_DIR}/lib/" 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libfftw3* "${PACKAGE_DIR}/lib/" 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libreadline* "${PACKAGE_DIR}/lib/" 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libncurses* "${PACKAGE_DIR}/lib/" 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libtinfo* "${PACKAGE_DIR}/lib/" 2>/dev/null || true

          # 4. Bitstreams and Configs
          if [ -d "FastFlowLM/src/xclbins" ]; then
              cp -rn FastFlowLM/src/xclbins/* "${PACKAGE_DIR}/share/fastflowlm/xclbins/" 2>/dev/null || true
              mkdir -p "${PACKAGE_DIR}/bin/xclbins"
              cp -rn FastFlowLM/src/xclbins/* "${PACKAGE_DIR}/bin/xclbins/" 2>/dev/null || true
          fi
          
          cp -v FastFlowLM/src/model_list.json "${PACKAGE_DIR}/bin/"
          cp -v FastFlowLM/src/model_info.json "${PACKAGE_DIR}/bin/"
          cp -v FastFlowLM/src/model_list.json "${PACKAGE_DIR}/share/flm/"
          cp -v FastFlowLM/src/model_info.json "${PACKAGE_DIR}/share/flm/"
          cp -v FastFlowLM/src/model_list.json "${PACKAGE_DIR}/share/fastflowlm/"
          cp -v FastFlowLM/src/model_info.json "${PACKAGE_DIR}/share/fastflowlm/"
          
          cp -v install.sh "${PACKAGE_DIR}/"
          cp -v README.md "${PACKAGE_DIR}/"
          
          tar -czvf flm-maple-linux-x86_64.tar.gz "${PACKAGE_DIR}"
          echo "archive=flm-maple-linux-x86_64.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload CI Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flm-maple-linux-x86_64
          path: flm-maple-linux-x86_64.tar.gz
          retention-days: 14

      - name: Publish GitHub Release (Latest Commit & Tags)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="latest"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          RELEASE_TITLE="FastFlowLM Maple-20B (latest commit: ${SHORT_SHA})"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_TITLE="FastFlowLM Maple-20B Release (${GITHUB_REF_NAME})"
          fi

          echo "Publishing release with tag '${TAG_NAME}' (${RELEASE_TITLE})..."
          gh release delete "${TAG_NAME}" --yes || true
          git tag -f "${TAG_NAME}" "${GITHUB_SHA}"
          git push -f origin "${TAG_NAME}" || true

          BODY=$(cat <<EOF
          Automated production release for commit \`${GITHUB_SHA}\`.

          ### Included Binaries:
          - \`flm\`: FastFlowLM Runtime CLI & OpenAI-compatible REST server
          - \`convert_maple\`: Standalone HuggingFace -> Q4NX checkpoint converter
          - \`test_maple_integration\`: Comprehensive unit & integration verification
          - \`test_maple_high_context\`: 128K context scaling test
          - \`test_maple_vs_qwen36\`: Head-to-head comparative benchmark suite
          - \`test_agentic_benchmark\`: 100,000-token ultra-long context agentic benchmark
          - \`install.sh\`: One-click system installer

          ### One-Line Install via curl:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/phantomic12/maple-flm/main/install.sh | bash
          \`\`\`
          EOF
          )

          gh release create "${TAG_NAME}" flm-maple-linux-x86_64.tar.gz \
            --title "${RELEASE_TITLE}" \
            --notes "${BODY}" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
